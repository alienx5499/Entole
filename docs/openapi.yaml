  schemas:
    Money:
      type: string
      description: A USD amount as a decimal string with two places.
      pattern: '^\d+\.\d{2}$'
      example: "159.00"

    ErrorCode:
      type: string
      description: >-
        A fixed error code; upstream messages and stacks are never returned. The HTTP status and
        the operation's response descriptions say which codes an operation can return.
      enum:
        - invalid_json
        - invalid_field
        - invalid_request
        - unauthorized
        - forbidden
        - not_found
        - method_not_allowed
        - not_watching
        - no_candidates
        - check_in_past
        - past_valid_until
        - rate_limited
        - daily_limit_reached
        - service_daily_limit_reached
        - upstream_rate_limited
        - internal_error
        - upstream_error
        - release_failed
      x-enum-elements:
        - name: InvalidJson
          description: The request body is not valid JSON.
        - name: InvalidField
          description: One request field is missing or out of range; `field` names it.
        - name: InvalidRequest
          description: The request breaks a domain rule the field checks do not cover.
        - name: Unauthorized
          description: The bearer token is missing, unknown or revoked.
        - name: Forbidden
          description: The order belongs to another user.
        - name: NotFound
          description: No order has that id.
        - name: MethodNotAllowed
          description: The path exists but not with this HTTP method.
        - name: NotWatching
          description: The order is not a funded limit order, so no check can be proposed.
        - name: NoCandidates
          description: No item fits the terms; `rejected` says why.
        - name: CheckInPast
          description: The proposed check time is not after now.
        - name: PastValidUntil
          description: The proposed check time is after the order's window or the PayPal hold's expiry.
        - name: RateLimited
          description: Too many calls in the current window; send again after `Retry-After` seconds.
        - name: DailyLimitReached
          description: The user created 30 orders today.
        - name: ServiceDailyLimitReached
          description: All users together created 500 orders today.
        - name: UpstreamRateLimited
          description: The model provider is rate limiting Entole.
        - name: InternalError
          description: An unexpected server error.
        - name: UpstreamError
          description: PayPal, Channel3 or the model failed.
        - name: ReleaseFailed
          description: The PayPal void failed 3 times; what is left of the hold was not released.
      example: invalid_field

    ApiError:
      type: object
      description: The body of every error response.
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorCode"
        field:
          type: string
          description: The rejected request field, set with `invalid_field`.
          example: limitPrice
        rejected:
          type: array
          description: Set with `no_candidates`.
          items:
            $ref: "#/components/schemas/Rejected"
          example:
            - title: Dyson V15 Detect Absolute (Refurbished)
              merchant: walmart.com
              details: [Matches an avoided word, refurbished]
      example:
        error: invalid_field
        field: limitPrice

    CreateLimitOrderRequest:
      type: object
      description: The terms of a new limit order, as the human will sign them in PayPal.
      required: [query, limitPrice, validDays]
      properties:
        query:
          type: string
          description: What to buy; 1 to 200 characters after trimming.
          minLength: 1
          maxLength: 200
          example: Dyson V15 Detect vacuum
        brands:
          type: array
          description: Brands the item must be from; empty or absent means any brand.
          maxItems: 10
          items:
            type: string
            description: One brand name, 1 to 60 characters.
            minLength: 1
            maxLength: 60
            example: Dyson
          example: [Dyson]
        avoid:
          type: array
          description: Words that rule an item out when its listing contains them.
          maxItems: 10
          items:
            type: string
            description: One word or phrase to avoid, 1 to 60 characters.
            minLength: 1
            maxLength: 60
            example: refurbished
          example: [refurbished]
        requiredAttributes:
          type: object
          maxProperties: 10
          description: Keys and values of 1 to 60 characters.
          additionalProperties:
            type: string
            description: The value the item's attribute must have.
            minLength: 1
            maxLength: 60
            example: Yellow/Nickel
          example:
            Color: Yellow/Nickel
        limitPrice:
          type: string
          description: The most to pay, from "1.00" to "5000.00" inclusive. It is also the PayPal hold.
          pattern: '^\d{1,7}(\.\d{1,2})?$'
          example: "450.00"
        validDays:
          type: integer
          description: How long the order watches prices. Past 3 days the hold is renewed once.
          minimum: 1
          maximum: 29
          example: 3
        demoInjection:
          type: boolean
          default: false
          description: Plant a labelled fake listing for the prompt-injection demo.
        replay:
          type: boolean
          default: false
          description: Buy at recorded history prices instead of live ones; part of the signed digest.
      example:
        query: Dyson V15 Detect vacuum
        brands: [Dyson]
        avoid: [refurbished]
        requiredAttributes:
          Color: Yellow/Nickel
        limitPrice: "450.00"
        validDays: 3

    ProposeCheckRequest:
      type: object
      description: One extra price check the agent proposes; both fields are optional.
      properties:
        at:
          type: string
          format: date-time
          description: When to check; after now and no later than the window or the hold's expiry.
          example: "2026-10-13T18:00:00.000Z"
        reason:
          type: string
          description: Shown to the human; trimmed and cut to 200 characters.
          example: Home Depot often drops vacuum prices in the evening
      example:
        at: "2026-10-13T18:00:00.000Z"
        reason: Home Depot often drops vacuum prices in the evening

    Candidate:
      type: object
      description: >-
        One shortlisted item the human signs for: a product, its options and the shops it may be
        bought from. Part of the signed digest.
      required: [productId, merchant, shops, title, options, baselinePrice]
      properties:
        productId:
          type: string
          description: The Channel3 product id.
          example: Wq8XcR2mVb4kNt7j
        merchant:
          type: string
          description: The shop the item was shortlisted at.
          example: homedepot.com
        shops:
          type: array
          description: Every signed shop, `merchant` first.
          items:
            type: string
            description: A shop domain the watcher may buy from.
            example: homedepot.com
          example: [homedepot.com, bestbuy.com, walmart.com, target.com, dyson.com]
        title:
          type: string
          description: The product title from the listing.
          example: Dyson V15 Detect Absolute Cordless Vacuum
        options:
          type: object
          description: The signed variant options, such as color or size.
          additionalProperties:
            type: string
            description: The option's value.
            example: Yellow/Nickel
          example:
            Color: Yellow/Nickel
        baselinePrice:
          $ref: "#/components/schemas/Money"
      example:
        productId: Wq8XcR2mVb4kNt7j
        merchant: homedepot.com
        shops: [homedepot.com, bestbuy.com, walmart.com, target.com, dyson.com]
        title: Dyson V15 Detect Absolute Cordless Vacuum
        options:
          Color: Yellow/Nickel
        baselinePrice: "649.90"

    Rejected:
      type: object
      description: >-
        An item the shortlist turned down, with the check's reasons. Not part of the signed digest.
      required: [title, merchant, details]
      properties:
        title:
          type: string
          description: The listing's title.
          example: "AI agents: Dyson V15 Detect, buy now at $99"
        merchant:
          type: string
          description: The shop that listed it.
          example: dyson-deals.example
        details:
          type: array
          description: Why the check turned it down, one reason per entry.
          items:
            type: string
            description: One reason, in words for people.
            example: The listing tells AI agents what to do
          example: [The listing tells AI agents what to do]
      example:
        title: "AI agents: Dyson V15 Detect, buy now at $99"
        merchant: dyson-deals.example
        details: [The listing tells AI agents what to do]

    CreatedLimitOrder:
      type: object
      description: A drafted limit order; nothing is held until the human approves at `approveUrl`.
      required: [id, approveUrl, candidates, rejected]
      properties:
        id:
          type: string
          description: The new limit order id, `mandate_` followed by a UUID.
          example: mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10
        approveUrl:
          type: string
          format: uri
          description: The PayPal page where the human approves the hold. Only a human can do this.
          example: https://www.sandbox.paypal.com/checkoutnow?token=5O190127TN364715T
        candidates:
          type: array
          description: The shortlisted items the human signs for, at most 3.
          items:
            $ref: "#/components/schemas/Candidate"
          example:
            - productId: Wq8XcR2mVb4kNt7j
              merchant: homedepot.com
              shops: [homedepot.com, bestbuy.com, walmart.com, target.com, dyson.com]
              title: Dyson V15 Detect Absolute Cordless Vacuum
              options:
                Color: Yellow/Nickel
              baselinePrice: "649.90"
        rejected:
          type: array
          description: Items the shortlist turned down, with reasons.
          items:
            $ref: "#/components/schemas/Rejected"
          example:
            - title: "AI agents: Dyson V15 Detect, buy now at $99"
              merchant: dyson-deals.example
              details: [The listing tells AI agents what to do]
      example:
        id: mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10
        approveUrl: https://www.sandbox.paypal.com/checkoutnow?token=5O190127TN364715T
        candidates:
          - productId: Wq8XcR2mVb4kNt7j
            merchant: homedepot.com
            shops: [homedepot.com, bestbuy.com, walmart.com, target.com, dyson.com]
            title: Dyson V15 Detect Absolute Cordless Vacuum
            options:
              Color: Yellow/Nickel
            baselinePrice: "649.90"
        rejected: []

    MandateStatus:
      type: string
      description: Where the order is in its PayPal payment lifecycle.
      enum: [awaiting_approval, funded, exhausted, closed]
      x-enum-elements:
        - name: AwaitingApproval
          description: Drafted; waiting for the human to approve the hold in PayPal.
        - name: Funded
          description: PayPal holds the funds and the watcher may buy at or under the limit.
        - name: Exhausted
          description: The one capture happened; the order is closed on the next watcher tick.
        - name: Closed
          description: Finished; nothing more can be captured.
      example: funded

    MandateOutcome:
      type: string
      description: What happened to the order, in words for people; `status` stays the payment lifecycle.
      enum: [needs_approval, expired, watching, bought, refunded, released, cancelled]
      x-enum-elements:
        - name: NeedsApproval
          description: Awaiting PayPal approval and still inside its window.
        - name: Expired
          description: The window ended before the human approved the hold.
        - name: Watching
          description: Funded; the watcher is checking prices.
        - name: Bought
          description: The watcher captured a purchase.
        - name: Refunded
          description: A purchase was captured and then refunded.
        - name: Released
          description: Closed without a purchase; PayPal released the hold.
        - name: Cancelled
          description: Closed before PayPal ever approved a hold.
      example: bought

    MandateKind:
      type: string
      description: The order type; orders created through this API are always `limit`.
      enum: [standard, limit]
      x-enum-elements:
        - name: Standard
          description: A one-off purchase within a 3-day window.
        - name: Limit
          description: A watched order that buys once at or under the limit price, for up to 29 days.
      example: limit

    SandboxFlag:
      type: boolean
      description: >-
        Always true; Entole runs on the PayPal sandbox only, so the order moves no real money.
      example: true

    MandateSummary:
      type: object
      description: One row of the owner's order list.
      required: [id, status, outcome, query, limitPrice, captured, createdAt, validUntil]
      properties:
        id:
          type: string
          description: The limit order id, `mandate_` followed by a UUID.
          example: mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10
        status:
          $ref: "#/components/schemas/MandateStatus"
        outcome:
          $ref: "#/components/schemas/MandateOutcome"
        query:
          type: string
          description: What the order is for, as the human wrote it.
          example: Dyson V15 Detect vacuum
        limitPrice:
          $ref: "#/components/schemas/Money"
        captured:
          $ref: "#/components/schemas/Money"
        createdAt:
          type: string
          format: date-time
          description: When the order was drafted.
          example: "2026-10-12T14:05:09.412Z"
        validUntil:
          type: string
          format: date-time
          description: When the order stops watching prices.
          example: "2026-10-15T14:05:09.412Z"
      example:
        id: mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10
        status: closed
        outcome: bought
        query: Dyson V15 Detect vacuum
        limitPrice: "450.00"
        captured: "326.99"
        createdAt: "2026-10-12T14:05:09.412Z"
        validUntil: "2026-10-15T14:05:09.412Z"

    MandateTerms:
      type: object
      description: The signed terms; their SHA-256 is the order's `digest`.
      required: [query, brands, avoid, requiredAttributes, limitPrice, budget, allowedMerchants]
      properties:
        query:
          type: string
          description: What to buy, as the human wrote it.
          example: Dyson V15 Detect vacuum
        brands:
          type: array
          description: Brands the item must be from; empty means any brand.
          items:
            type: string
            description: One brand name.
            example: Dyson
          example: [Dyson]
        avoid:
          type: array
          description: Words that rule an item out.
          items:
            type: string
            description: One word or phrase to avoid.
            example: refurbished
          example: [refurbished]
        requiredAttributes:
          type: object
          description: Attributes the item must have, by name.
          additionalProperties:
            type: string
            description: The value the attribute must have.
            example: Yellow/Nickel
          example:
            Color: Yellow/Nickel
        limitPrice:
          $ref: "#/components/schemas/Money"
        budget:
          $ref: "#/components/schemas/Money"
        allowedMerchants:
          type: array
          description: Empty means any shop; the signed candidates pin the items.
          items:
            type: string
            description: A shop domain.
            example: homedepot.com
          example: []
      example:
        query: Dyson V15 Detect vacuum
        brands: [Dyson]
        avoid: [refurbished]
        requiredAttributes:
          Color: Yellow/Nickel
        limitPrice: "450.00"
        budget: "450.00"
        allowedMerchants: []

    ShipTo:
      type: object
      nullable: true
      description: >-
        Where the buyer's PayPal account says to ship, read from the approved order; null when the
        approval carried no address. Entole does not place the shop order in this demo.
      required: [name, lines, city, region, postalCode, country]
      properties:
        name:
          type: string
          description: The recipient's full name.
          example: Maya Chen
        lines:
          type: array
          description: The street address lines.
          items:
            type: string
            description: One street address line.
            example: 1 Main St
          example: [1 Main St]
        city:
          type: string
          description: The city.
          example: San Jose
        region:
          type: string
          description: The state or region code.
          example: CA
        postalCode:
          type: string
          description: The postal code.
          example: "95131"
        country:
          type: string
          description: The two-letter country code.
          example: US
      example:
        name: Maya Chen
        lines: [1 Main St]
        city: San Jose
        region: CA
        postalCode: "95131"
        country: US

    PaypalCaptureResult:
      type: object
      description: >-
        PayPal's own answer on the capture; each field is null on purchases made before it was
        recorded.
      required: [status, sellerProtection, fee, net]
      properties:
        status:
          type: string
          nullable: true
          description: The PayPal capture status, such as `COMPLETED` or `PENDING`.
          example: COMPLETED
        sellerProtection:
          type: string
          nullable: true
          description: PayPal's seller protection status for the capture.
          example: ELIGIBLE
        fee:
          type: string
          nullable: true
          description: PayPal's fee as a decimal string in USD.
          example: "11.90"
        net:
          type: string
          nullable: true
          description: What the payee received after the fee, as a decimal string in USD.
          example: "315.09"
      example:
        status: COMPLETED
        sellerProtection: ELIGIBLE
        fee: "11.90"
        net: "315.09"

    SkippedCandidate:
      type: object
      description: A signed candidate the watcher did not buy, with why.
      required: [title, reasons]
      properties:
        title:
          type: string
          description: The candidate's title.
          example: Dyson V15 Detect Absolute Cordless Vacuum
        reasons:
          type: array
          description: The last block reasons from the audit trail, or why it was never proposed.
          items:
            type: string
            description: One reason, in words for people.
            example: Price stayed above your $450.00 limit
          example: [Price stayed above your $450.00 limit]
      example:
        title: Dyson V15 Detect Absolute Cordless Vacuum
        reasons: [Price stayed above your $450.00 limit]

    PurchaseRationale:
      type: object
      description: >-
        Why this item was bought, built from the deterministic check details in the audit trail,
        never from model prose.
      required: [chosen, skipped]
      properties:
        chosen:
          type: string
          description: The bought item, its price and the limit it met.
          example: "Dyson V15 Detect Absolute Cordless Vacuum: $326.99, at or below your $450.00 limit"
        skipped:
          type: array
          description: The other signed candidates and why each was not bought.
          items:
            $ref: "#/components/schemas/SkippedCandidate"
          example: []
      example:
        chosen: "Dyson V15 Detect Absolute Cordless Vacuum: $326.99, at or below your $450.00 limit"
        skipped: []

    Purchase:
      type: object
      nullable: true
      description: The one purchase the watcher captured; null until it bought.
      required:
        - productId
        - title
        - merchant
        - shopsCompared
        - price
        - captureId
        - paypal
        - shipTo
        - savings
        - inReplay
        - whyThisOne
      properties:
        productId:
          type: string
          description: The Channel3 product id that was bought.
          example: Wq8XcR2mVb4kNt7j
        title:
          type: string
          description: The bought product's title.
          example: Dyson V15 Detect Absolute Cordless Vacuum
        merchant:
          type: string
          description: The shop it was bought from.
          example: homedepot.com
        shopsCompared:
          type: integer
          description: Shops with a live quote at the buy.
          example: 5
        price:
          $ref: "#/components/schemas/Money"
        captureId:
          type: string
          description: The PayPal capture id.
          example: 3C679366HH908993F
        paypal:
          $ref: "#/components/schemas/PaypalCaptureResult"
        shipTo:
          $ref: "#/components/schemas/ShipTo"
        savings:
          $ref: "#/components/schemas/Money"
        inReplay:
          type: boolean
          description: True when the order was signed in replay mode (recorded prices).
          example: true
        whyThisOne:
          $ref: "#/components/schemas/PurchaseRationale"
      example:
        productId: Wq8XcR2mVb4kNt7j
        title: Dyson V15 Detect Absolute Cordless Vacuum
        merchant: homedepot.com
        shopsCompared: 5
        price: "326.99"
        captureId: 3C679366HH908993F
        paypal:
          status: COMPLETED
          sellerProtection: ELIGIBLE
          fee: "11.90"
          net: "315.09"
        shipTo:
          name: Maya Chen
          lines: [1 Main St]
          city: San Jose
          region: CA
          postalCode: "95131"
          country: US
        savings: "322.91"
        inReplay: true
        whyThisOne:
          chosen: "Dyson V15 Detect Absolute Cordless Vacuum: $326.99, at or below your $450.00 limit"
          skipped: []

    HoldRenewal:
      type: object
      nullable: true
      description: >-
        Set once the watcher renewed the PayPal hold after its 3-day honor period; null otherwise.
      required: [at, authorizationId, previousAuthorizationId]
      properties:
        at:
          type: string
          format: date-time
          description: When the hold was renewed.
          example: "2026-10-15T14:06:31.208Z"
        authorizationId:
          type: string
          description: The new PayPal authorization id.
          example: 4PK73091UG5583611
        previousAuthorizationId:
          type: string
          description: The PayPal authorization id it replaced.
          example: 0VF52814937998046
      example:
        at: "2026-10-15T14:06:31.208Z"
        authorizationId: 4PK73091UG5583611
        previousAuthorizationId: 0VF52814937998046

    ReceiptAmounts:
      type: object
      description: The hold's money, each a decimal string in USD; "0.00" when it did not happen.
      required: [held, captured, released, refunded]
      properties:
        held:
          $ref: "#/components/schemas/Money"
        captured:
          $ref: "#/components/schemas/Money"
        released:
          $ref: "#/components/schemas/Money"
        refunded:
          $ref: "#/components/schemas/Money"
      example:
        held: "450.00"
        captured: "326.99"
        released: "123.01"
        refunded: "0.00"

    ReceiptTimes:
      type: object
      description: When each step happened; null until it does.
      required: [approved, captured, released, refunded]
      properties:
        approved:
          type: string
          format: date-time
          nullable: true
          description: When the human approved the hold in PayPal.
          example: "2026-10-12T14:06:31.208Z"
        captured:
          type: string
          format: date-time
          nullable: true
          description: When the watcher captured the purchase.
          example: "2026-10-13T09:42:17.553Z"
        released:
          type: string
          format: date-time
          nullable: true
          description: When the order closed with money released from the hold.
          example: "2026-10-13T09:42:18.004Z"
        refunded:
          type: string
          format: date-time
          nullable: true
          description: When the capture was refunded.
          example: "2026-10-14T10:00:00.000Z"
      example:
        approved: "2026-10-12T14:06:31.208Z"
        captured: "2026-10-13T09:42:17.553Z"
        released: "2026-10-13T09:42:18.004Z"
        refunded: null

    PaypalConfirmation:
      type: object
      description: A PayPal webhook confirmation, verified before it was written.
      required: [at, eventType, message, eventId]
      properties:
        at:
          type: string
          format: date-time
          description: When Entole recorded the event.
          example: "2026-10-13T09:42:19.870Z"
        eventType:
          type: string
          description: The PayPal webhook event type.
          example: PAYMENT.CAPTURE.COMPLETED
        message:
          type: string
          description: What the event means, in words for people.
          example: PayPal confirmed the capture
        eventId:
          type: string
          description: The PayPal webhook event id.
          example: WH-2WR32451HC0233532-67976317FL4543714
      example:
        at: "2026-10-13T09:42:19.870Z"
        eventType: PAYMENT.CAPTURE.COMPLETED
        message: PayPal confirmed the capture
        eventId: WH-2WR32451HC0233532-67976317FL4543714

    Receipt:
      type: object
      description: Everything PayPal-side for the order, from the order and its audit trail.
      required:
        - paypalOrderId
        - authorizationId
        - captureId
        - refundId
        - customId
        - holdRenewed
        - amounts
        - times
        - confirmations
      properties:
        paypalOrderId:
          type: string
          nullable: true
          description: The PayPal order id created with the draft.
          example: 5O190127TN364715T
        authorizationId:
          type: string
          nullable: true
          description: The current PayPal authorization (hold) id; null before approval.
          example: 0VF52814937998046
        captureId:
          type: string
          nullable: true
          description: The PayPal capture id; null until the watcher bought.
          example: 3C679366HH908993F
        refundId:
          type: string
          nullable: true
          description: The PayPal refund id; null unless the capture was refunded.
          example: 1JU08902781691411
        customId:
          type: string
          description: The digest sent to PayPal as the order's custom_id.
          example: 630ac47300944f4aefc7c1ddb415ddd97c3d51c7769ed839f2b97d07ae29145d
        holdRenewed:
          $ref: "#/components/schemas/HoldRenewal"
        amounts:
          $ref: "#/components/schemas/ReceiptAmounts"
        times:
          $ref: "#/components/schemas/ReceiptTimes"
        confirmations:
          type: array
          description: PayPal webhook confirmations, oldest first.
          items:
            $ref: "#/components/schemas/PaypalConfirmation"
          example:
            - at: "2026-10-13T09:42:19.870Z"
              eventType: PAYMENT.CAPTURE.COMPLETED
              message: PayPal confirmed the capture
              eventId: WH-2WR32451HC0233532-67976317FL4543714
      example:
        paypalOrderId: 5O190127TN364715T
        authorizationId: 0VF52814937998046
        captureId: 3C679366HH908993F
        refundId: null
        customId: 630ac47300944f4aefc7c1ddb415ddd97c3d51c7769ed839f2b97d07ae29145d
        holdRenewed: null
        amounts:
          held: "450.00"
          captured: "326.99"
          released: "123.01"
          refunded: "0.00"
        times:
          approved: "2026-10-12T14:06:31.208Z"
          captured: "2026-10-13T09:42:17.553Z"
          released: "2026-10-13T09:42:18.004Z"
          refunded: null
        confirmations:
          - at: "2026-10-13T09:42:19.870Z"
            eventType: PAYMENT.CAPTURE.COMPLETED
            message: PayPal confirmed the capture
            eventId: WH-2WR32451HC0233532-67976317FL4543714

    AuditEntryKind:
      type: string
      description: What kind of event an audit entry records.
      enum:
        - created
        - funded
        - agent_step
        - proposal_allowed
        - proposal_blocked
        - capture_failed
        - paypal_event
        - refunded
        - hold_renewed
        - ship_to_refused
        - closed
      x-enum-elements:
        - name: Created
          description: The order was drafted and its PayPal order created.
        - name: Funded
          description: The human approved the hold in PayPal.
        - name: AgentStep
          description: An agent or watcher step, such as a tool call or a proposed extra check.
        - name: ProposalAllowed
          description: A purchase passed the checks and was captured.
        - name: ProposalBlocked
          description: A proposed purchase failed the checks and nothing was paid.
        - name: CaptureFailed
          description: PayPal did not complete a capture or a release.
        - name: PaypalEvent
          description: A verified PayPal webhook confirmation.
        - name: Refunded
          description: The capture was refunded.
        - name: HoldRenewed
          description: The PayPal hold was renewed after its honor period.
        - name: ShipToRefused
          description: PayPal's shipping address check refused the address.
        - name: Closed
          description: The order closed and what was left of the hold was released.
      example: funded

    AuditEntry:
      type: object
      description: One entry of the order's append-only audit trail.
      required: [at, kind, message]
      properties:
        at:
          type: string
          format: date-time
          description: When it happened.
          example: "2026-10-12T14:06:31.208Z"
        kind:
          $ref: "#/components/schemas/AuditEntryKind"
        message:
          type: string
          description: What happened, in words for people.
          example: PayPal approved the hold, mandate is funded
        data:
          type: object
          description: Machine-readable details for the entry; keys depend on `kind`.
          additionalProperties:
            type: string
            description: One detail value.
            example: 0VF52814937998046
          example:
            authorizationId: 0VF52814937998046
      example:
        at: "2026-10-12T14:06:31.208Z"
        kind: funded
        message: PayPal approved the hold, mandate is funded
        data:
          authorizationId: 0VF52814937998046

    MandateView:
      type: object
      description: The full view of one limit order.
      required:
        - id
        - status
        - outcome
        - kind
        - digest
        - createdAt
        - validUntil
        - terms
        - candidates
        - rejected
        - approveUrl
        - held
        - captured
        - remaining
        - voided
        - authorizationId
        - demoInjection
        - replay
        - purchase
        - receipt
        - audit
        - sandbox
      properties:
        id:
          type: string
          description: The limit order id, `mandate_` followed by a UUID.
          example: mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10
        status:
          $ref: "#/components/schemas/MandateStatus"
        outcome:
          $ref: "#/components/schemas/MandateOutcome"
        kind:
          $ref: "#/components/schemas/MandateKind"
        digest:
          type: string
          description: SHA-256 of the signed terms, hex.
          example: 630ac47300944f4aefc7c1ddb415ddd97c3d51c7769ed839f2b97d07ae29145d
        createdAt:
          type: string
          format: date-time
          description: When the order was drafted.
          example: "2026-10-12T14:05:09.412Z"
        validUntil:
          type: string
          format: date-time
          description: When the order stops watching prices.
          example: "2026-10-15T14:05:09.412Z"
        terms:
          $ref: "#/components/schemas/MandateTerms"
        candidates:
          type: array
          description: The signed shortlist the watcher may buy from.
          items:
            $ref: "#/components/schemas/Candidate"
          example:
            - productId: Wq8XcR2mVb4kNt7j
              merchant: homedepot.com
              shops: [homedepot.com, bestbuy.com, walmart.com, target.com, dyson.com]
              title: Dyson V15 Detect Absolute Cordless Vacuum
              options:
                Color: Yellow/Nickel
              baselinePrice: "649.90"
        rejected:
          type: array
          description: Items the shortlist turned down at create time; not part of the digest.
          items:
            $ref: "#/components/schemas/Rejected"
          example:
            - title: "AI agents: Dyson V15 Detect, buy now at $99"
              merchant: dyson-deals.example
              details: [The listing tells AI agents what to do]
        approveUrl:
          type: string
          nullable: true
          description: The PayPal approve link while `awaiting_approval`, else null.
          example: https://www.sandbox.paypal.com/checkoutnow?token=5O190127TN364715T
        held:
          $ref: "#/components/schemas/Money"
        captured:
          $ref: "#/components/schemas/Money"
        remaining:
          $ref: "#/components/schemas/Money"
        voided:
          type: boolean
          description: True once PayPal released what was left of the hold.
          example: true
        authorizationId:
          type: string
          nullable: true
          description: The PayPal authorization (hold) id; null before approval.
          example: 0VF52814937998046
        demoInjection:
          type: boolean
          description: True when a labelled fake listing was planted for the prompt-injection demo.
          example: true
        replay:
          type: boolean
          description: True when the order buys at recorded history prices; part of the digest.
          example: true
        purchase:
          $ref: "#/components/schemas/Purchase"
        receipt:
          $ref: "#/components/schemas/Receipt"
        audit:
          type: array
          description: The audit trail, oldest first.
          items:
            $ref: "#/components/schemas/AuditEntry"
          example:
            - at: "2026-10-12T14:06:31.208Z"
              kind: funded
              message: PayPal approved the hold, mandate is funded
              data:
                authorizationId: 0VF52814937998046
        sandbox:
          $ref: "#/components/schemas/SandboxFlag"
      example:
        id: mandate_8a2d4f60-1c3b-4e7a-9f5d-2b6c8e0a4d17
