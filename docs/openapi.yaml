    Ap2Protocol:
      type: string
      description: The protocol name, always `AP2`.
      enum: [AP2]
      x-enum-elements:
        - name: Ap2
          description: Agent Payments Protocol.
      example: AP2

    Ap2Version:
      type: string
      description: The AP2 version the export follows, always `0.2`.
      enum: ["0.2"]
      x-enum-elements:
        - name: V02
          description: AP2 v0.2, the release of 2026-04-28.
      example: "0.2"

    Ap2Mode:
      type: string
      description: The AP2 mode, always `human_not_present`.
      enum: [human_not_present]
      x-enum-elements:
        - name: HumanNotPresent
          description: >-
            The buyer approves open mandates up front, then the agent closes them on one checkout
            without the buyer present.
      example: human_not_present

    Ap2SignedFlag:
      type: boolean
      description: >-
        Always false; the claim sets are unsigned (see `note`), because Entole holds no buyer or
        agent signing key.
      example: false

    Ap2DigestAlgorithm:
      type: string
      description: The hash behind `digest`, always `sha-256`.
      enum: [sha-256]
      x-enum-elements:
        - name: Sha256
          description: SHA-256, hex encoded.
      example: sha-256

    Ap2PaypalReferences:
      type: object
      description: The PayPal ids behind the order; each is null until that step happened.
      required: [orderId, customId, authorizationId, captureId, refundId]
      properties:
        orderId:
          type: string
          nullable: true
          description: The PayPal order id.
          example: 5O190127TN364715T
        customId:
          type: string
          description: The order's custom_id at PayPal, equal to the digest.
          example: 630ac47300944f4aefc7c1ddb415ddd97c3d51c7769ed839f2b97d07ae29145d
        authorizationId:
          type: string
          nullable: true
          description: The PayPal authorization (hold) id.
          example: 0VF52814937998046
        captureId:
          type: string
          nullable: true
          description: The PayPal capture id.
          example: 3C679366HH908993F
        refundId:
          type: string
          nullable: true
          description: The PayPal refund id.
          example: 1JU08902781691411
      example:
        orderId: 5O190127TN364715T
        customId: 630ac47300944f4aefc7c1ddb415ddd97c3d51c7769ed839f2b97d07ae29145d
        authorizationId: 0VF52814937998046
        captureId: 3C679366HH908993F
        refundId: null

    Ap2EntoleContext:
      type: object
      description: Entole's own record of the order, which binds the AP2 mandates to the PayPal approval.
      required: [mandateId, status, digest, digestAlgorithm, paypal]
      properties:
        mandateId:
          type: string
          description: The limit order id.
          example: mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10
        status:
          $ref: "#/components/schemas/MandateStatus"
        digest:
          type: string
          description: SHA-256 of the signed terms, hex; also the PayPal order's custom_id.
          example: 630ac47300944f4aefc7c1ddb415ddd97c3d51c7769ed839f2b97d07ae29145d
        digestAlgorithm:
          $ref: "#/components/schemas/Ap2DigestAlgorithm"
        paypal:
          $ref: "#/components/schemas/Ap2PaypalReferences"
      example:
        mandateId: mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10
        status: closed
        digest: 630ac47300944f4aefc7c1ddb415ddd97c3d51c7769ed839f2b97d07ae29145d
        digestAlgorithm: sha-256
        paypal:
          orderId: 5O190127TN364715T
          customId: 630ac47300944f4aefc7c1ddb415ddd97c3d51c7769ed839f2b97d07ae29145d
          authorizationId: 0VF52814937998046
          captureId: 3C679366HH908993F
          refundId: null

    Ap2CheckoutMandateType:
      type: string
      description: The closed checkout mandate's type, always `mandate.checkout.1`.
      enum: [mandate.checkout.1]
      x-enum-elements:
        - name: MandateCheckout1
          description: AP2 closed checkout mandate, version 1.
      example: mandate.checkout.1

    Ap2CheckoutMandate:
      type: object
      nullable: true
      description: AP2 `mandate.checkout.1`; null until the one capture.
      required: [vct, checkout_jwt, checkout_hash, iat]
      properties:
        vct:
          $ref: "#/components/schemas/Ap2CheckoutMandateType"
        checkout_jwt:
          type: string
          description: The checkout as an unsecured JWT (alg none), since the shops do not sign checkouts.
          example: eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0..
        checkout_hash:
          type: string
          description: Base64url SHA-256 of `checkout_jwt`.
          example: m4p0_qVcUJy9DSQTkAvuJbMFSqqqLxkJwkZW8HGndrg
        iat:
          type: integer
          description: When it was issued, in Unix seconds (the capture time).
          example: 1791884537
      example:
        vct: mandate.checkout.1
        checkout_jwt: eyJhbGciOiJub25lIiwidHlwIjoiSldUIn0..
        checkout_hash: m4p0_qVcUJy9DSQTkAvuJbMFSqqqLxkJwkZW8HGndrg
        iat: 1791884537

    Ap2PaymentMandateType:
      type: string
      description: The closed payment mandate's type, always `mandate.payment.1`.
      enum: [mandate.payment.1]
      x-enum-elements:
        - name: MandatePayment1
          description: AP2 closed payment mandate, version 1.
      example: mandate.payment.1

    Ap2PaymentAmount:
      type: object
      description: The amount paid, in minor units.
      required: [amount, currency]
      properties:
        amount:
          type: number
          description: The captured amount in cents.
          example: 32699
        currency:
          type: string
          description: The ISO 4217 currency code.
          example: USD
      example:
        amount: 32699
        currency: USD

    Ap2Merchant:
      type: object
      description: >-
        An AP2 merchant. As a payee it is always Entole, the account that receives the funds in this
        sandbox demo; the shops are not paid.
      required: [id, name]
      properties:
        id:
          type: string
          description: The merchant id; a shop's domain, or `entole` for the payee.
          example: entole
        name:
          type: string
          description: The merchant's display name.
          example: Entole
        website:
          type: string
          format: uri
          description: The shop's website; set only when the id is a domain.
          example: https://homedepot.com
      example:
        id: homedepot.com
        name: homedepot.com
        website: https://homedepot.com

    Ap2PaymentInstrument:
      type: object
      description: The PayPal authorization hold the payment was captured from.
      required: [id, type]
      properties:
        id:
          type: string
          description: The PayPal authorization id.
          example: 0VF52814937998046
        type:
          type: string
          description: The instrument type, always `paypal.authorization`.
          example: paypal.authorization
        description:
          type: string
          description: The instrument in words for people.
          example: PayPal authorization hold approved by the buyer
      example:
        id: 4PK73091UG5583611
        type: paypal.authorization
        description: PayPal authorization hold approved by the buyer

    Ap2PaymentMandate:
      type: object
      nullable: true
      description: AP2 `mandate.payment.1`; null until the one capture.
      required:
        [vct, transaction_id, payee, payment_amount, payment_instrument, execution_date, iat]
      properties:
        vct:
          $ref: "#/components/schemas/Ap2PaymentMandateType"
        transaction_id:
          type: string
          description: The checkout mandate's `checkout_hash`, which ties the payment to that checkout.
          example: m4p0_qVcUJy9DSQTkAvuJbMFSqqqLxkJwkZW8HGndrg
        payee:
          $ref: "#/components/schemas/Ap2Merchant"
        payment_amount:
          $ref: "#/components/schemas/Ap2PaymentAmount"
        payment_instrument:
          $ref: "#/components/schemas/Ap2PaymentInstrument"
        execution_date:
          type: string
          format: date-time
          description: When the capture happened.
          example: "2026-10-13T09:42:17.553Z"
        iat:
          type: integer
          description: When it was issued, in Unix seconds (the capture time).
          example: 1791884537
      example:
        vct: mandate.payment.1
        transaction_id: m4p0_qVcUJy9DSQTkAvuJbMFSqqqLxkJwkZW8HGndrg
        payee:
          id: entole
          name: Entole
        payment_amount:
          amount: 32699
          currency: USD
        payment_instrument:
          id: 0VF52814937998046
          type: paypal.authorization
          description: PayPal authorization hold approved by the buyer
        execution_date: "2026-10-13T09:42:17.553Z"
        iat: 1791884537

    Ap2Export:
      type: object
      description: One limit order as unsigned Agent Payments Protocol v0.2 mandates.
      required:
        - protocol
        - version
        - spec
        - mode
        - signed
        - note
        - entole
        - openCheckoutMandate
        - openPaymentMandate
        - checkoutMandate
        - paymentMandate
      properties:
        protocol:
          $ref: "#/components/schemas/Ap2Protocol"
        version:
          $ref: "#/components/schemas/Ap2Version"
        spec:
          type: string
          format: uri
          description: Where the AP2 specification lives.
          example: https://ap2-protocol.org/
        mode:
          $ref: "#/components/schemas/Ap2Mode"
        signed:
          $ref: "#/components/schemas/Ap2SignedFlag"
        note:
          type: string
          description: What being unsigned means.
          example: >-
            Unsigned claim sets. AP2 secures each mandate as an SD-JWT: open mandates signed for
            the buyer with the agent's public key in cnf, closed mandates signed by that agent key,
            and checkout_jwt signed by the merchant. Entole holds no buyer or agent signing key and
            the shops do not sign checkouts, so cnf is empty, checkout_jwt is an unsecured JWT (alg
            none) and every hash is base64url SHA-256 over the JSON bytes shown here. What binds the
            buyer is the PayPal approval: entole.digest is the SHA-256 of the signed terms and is
            the PayPal order custom_id.
        entole:
          $ref: "#/components/schemas/Ap2EntoleContext"
        openCheckoutMandate:
          $ref: "#/components/schemas/Ap2OpenMandate"
        openPaymentMandate:
          $ref: "#/components/schemas/Ap2OpenMandate"
        checkoutMandate:
          $ref: "#/components/schemas/Ap2CheckoutMandate"
        paymentMandate:
          $ref: "#/components/schemas/Ap2PaymentMandate"
      example:
        protocol: AP2
        version: "0.2"
        spec: https://ap2-protocol.org/
        mode: human_not_present
        signed: false
        note: Unsigned claim sets.
        entole:
          mandateId: mandate_8a2d4f60-1c3b-4e7a-9f5d-2b6c8e0a4d17
          status: awaiting_approval
          digest: 1f4b8e2c6a9d3f7b0e5c8a2d4f6b9e1c3a7d0f5b8e2c4a6d9f1b3e7c0a5d8f2b
          digestAlgorithm: sha-256
          paypal:
            orderId: 8YB45213KD7730924
            customId: 1f4b8e2c6a9d3f7b0e5c8a2d4f6b9e1c3a7d0f5b8e2c4a6d9f1b3e7c0a5d8f2b
            authorizationId: null
            captureId: null
            refundId: null
        openCheckoutMandate:
          vct: mandate.checkout.open.1
          constraints:
            - type: checkout.allowed_merchants
              allowed:
                - id: homedepot.com
                  name: homedepot.com
                  website: https://homedepot.com
          cnf: {}
          iat: 1791966602
          exp: 1792225802
        openPaymentMandate:
          vct: mandate.payment.open.1
          constraints:
            - type: payment.amount_range
              currency: USD
              max: 45000
          cnf: {}
          iat: 1791966602
          exp: 1792225802
        checkoutMandate: null
        paymentMandate: null

    Ap2OpenMandateType:
      type: string
      description: The open mandate's type.
      enum: [mandate.checkout.open.1, mandate.payment.open.1]
      x-enum-elements:
        - name: MandateCheckoutOpen1
          description: Open checkout mandate; constrains which shops and items may be bought.
        - name: MandatePaymentOpen1
          description: Open payment mandate; constrains the amount, payee, instrument and date.
      example: mandate.checkout.open.1

    Ap2Constraint:
      type: object
      description: >-
        One AP2 constraint, such as `checkout.allowed_merchants` or `payment.amount_range`. The
        other fields depend on `type` and follow the AP2 JSON schemas.
      required: [type]
      properties:
        type:
          type: string
          description: The AP2 constraint type.
          example: payment.amount_range
      additionalProperties: true
      example:
        type: payment.amount_range
        currency: USD
        max: 45000

    Ap2Confirmation:
      type: object
      description: >-
        The AP2 `cnf` claim. Always `{}`: Entole holds no agent key, so `kid` is never set.
      properties:
        kid:
          type: string
          description: The id of the agent's confirmation key; never set by Entole.
          example: agent-key-1
      example: {}

    Ap2OpenMandate:
      type: object
      description: >-
        An AP2 open mandate (`mandate.checkout.open.1` or `mandate.payment.open.1`). The
        constraint objects follow the AP2 JSON schemas and are left open here.
      required: [vct, constraints, cnf, iat, exp]
      properties:
        vct:
          $ref: "#/components/schemas/Ap2OpenMandateType"
        constraints:
          type: array
          description: The limits the buyer approved, which the closed mandates must meet.
          items:
            $ref: "#/components/schemas/Ap2Constraint"
          example:
            - type: payment.amount_range
              currency: USD
              max: 45000
        cnf:
          $ref: "#/components/schemas/Ap2Confirmation"
        iat:
          type: integer
          description: When the order was created, in Unix seconds.
          example: 1791813909
        exp:
          type: integer
          description: When the order's window ends, in Unix seconds.
          example: 1792073109
      example:
        vct: mandate.payment.open.1
        constraints:
          - type: payment.amount_range
            currency: USD
            max: 45000
          - type: payment.allowed_payees
            allowed:
              - id: entole
                name: Entole
        cnf: {}
        iat: 1791813909
        exp: 1792073109
