openapi: 3.0.3
info:
  title: Entole API
  version: 1.0.0
  description: >-
    The agent-facing part of the Entole API: the routes a personal access token
    (`Authorization: Bearer ent_...`) may call. Entole runs on the PayPal sandbox only. An AI
    agent can draft a limit order, read it, propose an extra price check and cancel it, but it can
    never pay: a new order waits in `awaiting_approval` until the human opens `approveUrl` and
    approves the hold in PayPal, and only then may the watcher capture at or under the signed
    limit. Money is always a decimal string in USD, such as `"159.00"`, and dates are ISO 8601
    strings. Tokens are created, listed and revoked from a browser session at /connect, never with
    a token.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: Entole
    url: https://entole.vercel.app
  x-server-configuration:
    default-environment: production
    default-server: default
    environments:
      - name: production
        servers:
          - name: default
            url: https://entole.vercel.app
    parameters: []
servers:
  - url: https://entole.vercel.app
    description: Production (PayPal sandbox only)
security:
  - bearer: []
tags:
  - name: LimitOrders
    description: Draft, read and cancel limit orders as the token's owner.

paths:
  /api/me:
    get:
      operationId: getCurrentUser
      tags: [LimitOrders]
      summary: The token's owner and their saved taste
      description: >-
        Read only: returns the user who owns the bearer token and the brands, avoids and attributes
        Entole saved from their funded orders (`taste` is null until one order was funded). It moves
        no money and changes nothing. Like every route it shares the per-IP limit of 240 calls a
        minute (`rate_limited`).
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                me:
                  $ref: "#/components/examples/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/mandates:
    get:
      operationId: listLimitOrders
      tags: [LimitOrders]
      summary: The owner's limit orders, newest first
      description: One summary row per order; call `getLimitOrder` for the full view.
      responses:
        "200":
          description: The owner's orders.
          content:
            application/json:
              schema:
                type: array
                description: The owner's limit orders, newest first; empty when there are none.
                items:
                  $ref: "#/components/schemas/MandateSummary"
                example:
                  - id: mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10
                    status: closed
                    outcome: bought
                    query: Dyson V15 Detect vacuum
                    limitPrice: "450.00"
                    captured: "326.99"
                    createdAt: "2026-10-12T14:05:09.412Z"
                    validUntil: "2026-10-15T14:05:09.412Z"
              examples:
                orders:
                  $ref: "#/components/examples/LimitOrderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createLimitOrder
      tags: [LimitOrders]
      summary: Draft a limit order
      description: >-
        The shopping agent shortlists up to 3 items that fit the terms, and Entole creates a
        PayPal order for a hold of `limitPrice`. Nothing is held or paid until the human opens
        `approveUrl` and approves in PayPal. Limited to 10 calls a minute per user
        (`rate_limited`), 30 a day per user (`daily_limit_reached`) and 500 a day in total
        (`service_daily_limit_reached`).
      requestBody:
        required: true
        description: >-
          The terms the human will sign: what to buy, the most to pay and how many days to watch.
          They are hashed into the order's digest, so they cannot change after approval.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLimitOrderRequest"
            examples:
              dyson:
                $ref: "#/components/examples/CreateLimitOrderBody"
      responses:
        "200":
          description: The drafted order, awaiting the human's PayPal approval.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedLimitOrder"
              examples:
                drafted:
                  $ref: "#/components/examples/CreatedLimitOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: "`no_candidates`: no item fits the terms; `rejected` says why."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                noCandidates:
                  $ref: "#/components/examples/NoCandidates"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/mandates/{id}:
    parameters:
      - $ref: "#/components/parameters/MandateId"
    get:
      operationId: getLimitOrder
      tags: [LimitOrders]
      summary: One limit order with its terms, purchase, receipt and audit trail
      description: >-
        Read only: the full view of one order the token's owner created, with its signed terms,
        shortlist, PayPal hold amounts, the purchase once the watcher bought, the PayPal receipt
        and every audit entry. `approveUrl` is always null here. It moves no money; another
        user's order is `403 forbidden`. Like every route it shares the per-IP limit of 240 calls
        a minute (`rate_limited`).
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateView"
              examples:
                bought:
                  $ref: "#/components/examples/BoughtLimitOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/mandates/{id}/ap2:
    parameters:
      - $ref: "#/components/parameters/MandateId"
    get:
      operationId: getAp2Mandates
      tags: [LimitOrders]
      summary: The order as Agent Payments Protocol v0.2 mandates
      description: >-
        Unsigned AP2 claim sets, served as a JSON download, so an agent can hand the order to
        another agent. `checkoutMandate` and `paymentMandate` stay null until the one capture.
      responses:
        "200":
          description: The AP2 export.
          headers:
            Content-Disposition:
              description: '`attachment; filename="entole-<id>-ap2.json"`'
              schema:
                type: string
              example: 'attachment; filename="entole-mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10-ap2.json"'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ap2Export"
              examples:
                bought:
                  $ref: "#/components/examples/Ap2Export"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/mandates/{id}/close:
    parameters:
      - $ref: "#/components/parameters/MandateId"
    post:
      operationId: cancelLimitOrder
      tags: [LimitOrders]
      summary: Cancel the order and release what is left of the PayPal hold
      description: >-
        Shares the money limit of 20 calls a minute per user. If the PayPal void has failed 3
        times, the answer is `502 release_failed`.
      responses:
        "200":
          description: The closed order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateView"
              examples:
                released:
                  $ref: "#/components/examples/CancelledLimitOrder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/mandates/{id}/schedule/propose:
    parameters:
      - $ref: "#/components/parameters/MandateId"
    post:
      operationId: proposeExtraCheck
      tags: [LimitOrders]
      summary: Propose one extra price check on a funded order
      description: >-
        The proposal moves nothing: the human accepts or rejects it on the schedule page. With no
        `at`, the watcher picks a time 5, 15 or 45 minutes ahead from how close the best known
        price is to the limit. Shares the check-now limit of 60 calls a minute per order.
      requestBody:
        required: true
        description: >-
          When to check and why. Send `{}` to let the watcher pick the time and write the reason.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeCheckRequest"
            examples:
              tonight:
                $ref: "#/components/examples/ProposeCheckBody"
      responses:
        "200":
          description: The order with the proposal as its newest `agent_step` audit entry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MandateView"
              examples:
                proposed:
                  $ref: "#/components/examples/WatchingLimitOrder"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "`not_watching`: the order is not a funded limit order."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: not_watching
        "422":
          description: >-
            `check_in_past` when `at` is not after now, `past_valid_until` when it is after the
            order's window or the PayPal hold's expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error: check_in_past
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: >-
        A personal access token, `ent_` followed by 43 base64url characters. An unknown or revoked
        token is a 401 and never falls back to a session cookie.

  parameters:
    MandateId:
      name: id
      in: path
      required: true
      description: The limit order id.
      schema:
        type: string
        minLength: 1
        description: A limit order id, `mandate_` followed by a UUID.
        example: mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10
      example: mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10

  responses:
    BadRequest:
      description: "`invalid_json`, `invalid_request`, or `invalid_field` with the field name in `field`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: invalid_field
            field: limitPrice
    Unauthorized:
      description: "`unauthorized`: the token is missing, unknown or revoked."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: unauthorized
    Forbidden:
      description: "`forbidden`: the order belongs to another user."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: forbidden
    NotFound:
      description: "`not_found`: no order with that id."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: not_found
    TooManyRequests:
      description: >-
        `rate_limited` (send again after `Retry-After` seconds), `daily_limit_reached`,
        `service_daily_limit_reached`, or `upstream_rate_limited` (the model provider).
      headers:
        Retry-After:
          description: Seconds to wait; set on `rate_limited` only.
          schema:
            type: integer
          example: 42
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: rate_limited
    InternalError:
      description: "`internal_error`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: internal_error
    BadGateway:
      description: "`upstream_error` (PayPal, Channel3 or the model failed) or `release_failed`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error: upstream_error

  examples:
    Me:
      summary: A buyer who funded one order
      value:
        user:
          id: user_7b1e4c92-2d3a-4f8e-a6b5-0c9d8e7f6a21
          email: maya@example.com
          name: Maya Chen
        taste:
          brands: [Dyson]
          avoid: [refurbished]
          attributes:
            Color: Yellow/Nickel

    LimitOrderList:
      summary: One bought order and one still watching
      value:
        - id: mandate_8a2d4f60-1c3b-4e7a-9f5d-2b6c8e0a4d17
          status: funded
          outcome: watching
          query: Dyson V15 Detect vacuum
          limitPrice: "450.00"
          captured: "0.00"
          createdAt: "2026-10-14T08:30:02.115Z"
          validUntil: "2026-10-17T08:30:02.115Z"
        - id: mandate_3f9c2a71-8d4e-4b6a-9c1e-5a7b2d8e4f10
          status: closed
          outcome: bought
          query: Dyson V15 Detect vacuum
          limitPrice: "450.00"
          captured: "326.99"
          createdAt: "2026-10-12T14:05:09.412Z"
          validUntil: "2026-10-15T14:05:09.412Z"

    CreateLimitOrderBody:
      summary: A Dyson V15 Detect at $450 or less within 3 days
      value:
        query: Dyson V15 Detect vacuum
        brands: [Dyson]
        avoid: [refurbished]
        requiredAttributes:
          Color: Yellow/Nickel
        limitPrice: "450.00"
        validDays: 3
        demoInjection: true
