          Unsigned claim sets. AP2 secures each mandate as an SD-JWT: open mandates signed for the
          buyer with the agent's public key in cnf, closed mandates signed by that agent key, and
          checkout_jwt signed by the merchant. Entole holds no buyer or agent signing key and the
          shops do not sign checkouts, so cnf is empty, checkout_jwt is an unsecured JWT (alg none)
          and every hash is base64url SHA-256 over the JSON bytes shown here. What binds the buyer
          is the PayPal approval: entole.digest is the SHA-256 of the signed terms and is the
