          example: user_7b1e4c92-2d3a-4f8e-a6b5-0c9d8e7f6a21
        email:
          type: string
          description: The email address on the user's PayPal account.
          example: maya@example.com
        name:
          type: string
          description: The name on the user's PayPal account.
          example: Maya Chen
      example:
        id: user_7b1e4c92-2d3a-4f8e-a6b5-0c9d8e7f6a21
        email: maya@example.com
        name: Maya Chen

    Taste:
      type: object
      nullable: true
      description: >-
        Brands, avoids and attributes saved from the user's funded orders; null until one order
        was funded.
      required: [brands, avoid, attributes]
      properties:
        brands:
          type: array
          description: Brands from the user's funded orders.
          items:
            type: string
            description: One brand name.
            example: Dyson
