name: Smoke test after deploy

# Vercel reports each deployment back to GitHub. When a production deploy succeeds, check that the
# site loads and that its /api proxy reaches the Render API.

on:
  deployment_status:

permissions:
  contents: read

jobs:
  smoke:
    name: Production smoke test
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE: ${{ github.event.deployment_status.environment_url }}
    steps:
      - name: Home page loads
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors -o /dev/null -w "%{http_code} home\n" "$SITE/"
      # The free Render instance can take up to a minute to wake, hence the retries.
      - name: API is reachable through the site
        run: curl --fail --silent --show-error --retry 8 --retry-delay 15 --retry-all-errors -w "\n" "$SITE/api/health"
